# Configuracion general de Sentry Log.
# Este archivo puede cargarse desde Bash con: source config/sentrylog.conf

PROJECT_NAME="Sentry Log"

# Rutas dentro del repositorio.
CONFIG_DIR="config"
SCRIPT_DIR="scripts"
DATA_DIR="data"
LOG_DIR="data/logs"
REPORT_DIR="data/reports"
RUNTIME_DIR="runtime"
PID_DIR="runtime/pids"
STATE_DIR="runtime/state"

# Rutas del servidor empresarial simulado.
COMPANY_ROOT="/empresa"
AUDIT_DIR="/empresa/auditoria"
PUBLIC_DIR="/empresa/publico"

# Archivos usados durante la ejecucion.
ADMIN_LOG="data/logs/admin.log"
SECURITY_LOG="data/logs/security.log"
SSH_AUDIT_LOG="data/logs/ssh_audit.log"
CHECKSUM_DB="runtime/state/checksums.db"
SECURITY_MONITOR_PID="runtime/pids/security_monitor.pid"

# Configuracion del monitor de seguridad.
MONITOR_INTERVAL_SECONDS=10
CHECKSUM_BIN="bin/checksum"

# Log SSH principal. En Ubuntu/Debian suele ser /var/log/auth.log.
SSH_LOG_FILE="/var/log/auth.log"
