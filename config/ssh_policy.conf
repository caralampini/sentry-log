# Politica SSH esperada para el servidor simulado.
# Formato: clave=valor

SSH_PORT=22
ALLOW_ROOT_LOGIN=no
ALLOW_PASSWORD_AUTH=yes
MAX_AUTH_TRIES=3
LOGIN_GRACE_TIME=60
ALLOW_USERS="admin juan maria pedro"
ADMIN_USERS="admin"

# Para browser SSH/Cloudflare Tunnel, el puerto puede permanecer interno.
REMOTE_ACCESS_METHOD="cloudflare_tunnel"
