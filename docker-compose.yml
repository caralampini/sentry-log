services:
  hermes:
    build: .
    container_name: hermes
    restart: unless-stopped

    volumes:
      - ./config:/app/config
      - ./data/empresa:/empresa
      - ./data/logs:/app/data/logs
    ports:
      - "2222:22"
    networks:
      - sentry_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    depends_on:
      - hermes
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?TUNNEL_TOKEN es requerido}
    networks:
      - sentry_net

networks:
  sentry_net:
    driver: bridge
